    <style>
        /* =========================================
           CONTACT PAGE
        ========================================= */

        .contact-page {
            min-height: 100vh;
            padding: 120px 8vw 80px;
        }

        .contact-hero {
            max-width: 850px;
            margin: 0 auto 70px;
            text-align: center;
        }

        .contact-eyebrow {
            font-size: 12px;
            letter-spacing: 3px;
            font-weight: 700;
            margin-bottom: 20px;
            opacity: 0.65;
        }

        .contact-hero h1 {
            font-size: clamp(42px, 6vw, 78px);
            line-height: 1;
            margin: 0 0 25px;
            letter-spacing: -3px;
        }

        .contact-hero h1 span {
            display: block;
            color: #91b89b;
        }

        .contact-hero p {
            max-width: 680px;
            margin: auto;
            font-size: 17px;
            line-height: 1.8;
            opacity: 0.7;
        }

        /* =========================================
           SELECTOR
        ========================================= */

        .contact-selector {
            max-width: 1100px;
            margin: 0 auto 50px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .selector-step {
            padding: 28px;
            border: 1px solid rgba(130, 160, 150, 0.22);
            border-radius: 24px;
            background: rgba(255,255,255,0.035);
        }

        .step-number {
            font-size: 12px;
            letter-spacing: 2px;
            font-weight: 700;
            opacity: 0.5;
            margin-bottom: 18px;
        }

        .selector-step label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .selector-step select {
            width: 100%;
            padding: 15px 16px;
            border-radius: 14px;
            border: 1px solid rgba(130, 160, 150, 0.3);
            background: #182328;
            color: #edf4f0;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        .selector-step select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .selector-step select:focus {
            border-color: #91b89b;
        }

        /* =========================================
           RESULT
        ========================================= */

        .helpline-result {
            max-width: 1100px;
            margin: 0 auto;
        }

        .result-placeholder,
        .helpline-card {
            border: 1px solid rgba(130, 160, 150, 0.22);
            border-radius: 28px;
            padding: 45px;
            background: rgba(255,255,255,0.035);
        }

        .result-placeholder {
            text-align: center;
        }

        .result-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: rgba(145,184,155,0.12);
            font-size: 25px;
        }

        .result-placeholder h2 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .result-placeholder p {
            max-width: 600px;
            margin: auto;
            line-height: 1.7;
            opacity: 0.65;
        }

        .helpline-card {
            max-width: 720px;
            margin: 0 auto;
        }

        .result-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .verified-label {
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 800;
            color: #91b89b;
        }

        .phone-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(145,184,155,0.12);
        }

        .result-category {
            font-size: 13px;
            opacity: 0.55;
            margin-bottom: 8px;
        }

        .helpline-card h2 {
            font-size: clamp(32px, 5vw, 52px);
            margin: 0 0 25px;
            letter-spacing: -2px;
        }

        .helpline-meta {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 18px 0;
            border-top: 1px solid rgba(130,160,150,0.15);
            border-bottom: 1px solid rgba(130,160,150,0.15);
        }

        .helpline-meta strong {
            font-size: 13px;
        }

        .helpline-meta span {
            font-size: 13px;
            opacity: 0.55;
        }

        .result-note {
            line-height: 1.7;
            font-size: 14px;
            opacity: 0.65;
            margin: 22px 0;
        }

        .call-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 14px 25px;
            border-radius: 999px;

            background: #91b89b;
            color: #101819;

            text-decoration: none;
            font-weight: 800;
            font-size: 14px;

            transition: transform 0.2s ease;
        }

        .call-button:hover {
            transform: translateY(-2px);
        }

        .back-button {
            display: block;
            width: fit-content;
            margin: 45px auto 0;

            color: inherit;
            text-decoration: none;
            opacity: 0.6;
            font-size: 14px;
        }

        .back-button:hover {
            opacity: 1;
        }

        /* =========================================
           LIGHT MODE
        ========================================= */

        body:not(.dark-mode) .selector-step select {
            background: #ffffff;
            color: #172328;
        }

        body:not(.dark-mode) .selector-step,
        body:not(.dark-mode) .result-placeholder,
        body:not(.dark-mode) .helpline-card {
            background: rgba(255,255,255,0.8);
            border-color: rgba(40,60,60,0.12);
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 800px) {

            .contact-page {
                padding: 110px 20px 60px;
            }

            .contact-selector {
                grid-template-columns: 1fr;
            }

            .contact-hero h1 {
                letter-spacing: -2px;
            }

            .selector-step,
            .result-placeholder,
            .helpline-card {
                padding: 28px;
            }
        }
    </style>
</head>

/* =========================================
   ELEMENTS
========================================= */

const stateSelect =
    document.getElementById("stateSelect");

const citySelect =
    document.getElementById("citySelect");

const wasteSelect =
    document.getElementById("wasteSelect");

const result =
    document.getElementById("helplineResult");


/* =========================================
   POPULATE STATES
========================================= */

Object.entries(locations)
    .sort((a, b) =>
        a[1].name.localeCompare(b[1].name)
    )
    .forEach(([key, state]) => {

        const option =
            document.createElement("option");

        option.value = key;
        option.textContent = state.name;

        stateSelect.appendChild(option);

    });


/* =========================================
   STATE CHANGE
========================================= */

stateSelect.addEventListener("change", function () {

    const selectedState =
        locations[this.value];


    citySelect.innerHTML =
        `<option value="">
            Select your city
        </option>`;


    wasteSelect.innerHTML =
        `<option value="">
            Select city first
        </option>`;


    citySelect.disabled = true;
    wasteSelect.disabled = true;


    if (!selectedState) {

        showPlaceholder();
        return;

    }


    selectedState.cities
        .slice()
        .sort((a, b) =>
            a.localeCompare(b)
        )
        .forEach(city => {

            const option =
                document.createElement("option");

            option.value =
                city.toLowerCase();

            option.textContent =
                city;

            citySelect.appendChild(option);

        });


    citySelect.disabled = false;

    showPlaceholder();

});


/* =========================================
   CITY CHANGE
========================================= */

citySelect.addEventListener("change", function () {

    wasteSelect.innerHTML =
        `<option value="">
            Select waste type
        </option>`;


    if (!this.value) {

        wasteSelect.disabled = true;

        showPlaceholder();

        return;

    }


    Object.entries(wasteTypes)
        .forEach(([key, name]) => {

            const option =
                document.createElement("option");

            option.value = key;

            option.textContent = name;

            wasteSelect.appendChild(option);

        });


    wasteSelect.disabled = false;

    showPlaceholder();

});


/* =========================================
   WASTE CHANGE
========================================= */

wasteSelect.addEventListener("change", function () {

    if (!this.value) {

        showPlaceholder();

        return;

    }


    const state =
        stateSelect.value;

    const city =
        citySelect.value;


    const exactKey =
        `${state}|${city}|${this.value}`;


    const globalKey =
        `global|${this.value}`;


    const contact =
        contacts[exactKey] ||
        contacts[globalKey];


    if (contact) {

        showContact(contact);

    } else {

        showUnavailable();

    }

});


/* =========================================
   SHOW CONTACT
========================================= */

function showContact(data) {

    result.innerHTML = `

        <div class="helpline-card">

            <div class="result-top">

                <span class="verified-label">
                    AVAILABLE CONTACT
                </span>

                <span class="phone-icon">
                    ☎
                </span>

            </div>


            <p class="result-category">
                ${data.organisation}
            </p>


            <h2>
                ${data.number}
            </h2>


            <div class="helpline-meta">

                <strong>
                    ${data.label}
                </strong>

                <span>
                    ${data.organisation}
                </span>

            </div>


            <p class="result-note">
                ${data.note}
            </p>


            <a
                href="tel:${data.number.replace(/[^0-9+]/g, '')}"
                class="call-button">

                Call Now

            </a>

        </div>

    `;

}


/* =========================================
   NO VERIFIED CONTACT
========================================= */

function showUnavailable() {

    result.innerHTML = `

        <div class="result-placeholder">

            <div class="result-icon">
                !
            </div>

            <h2>
                Local contact not available yet
            </h2>

            <p>
                We don't have a verified city-specific
                contact for this waste type yet.
                Please contact your local municipal
                authority instead of relying on an
                unverified number.
            </p>

        </div>

    `;

}


/* =========================================
   PLACEHOLDER
========================================= */

function showPlaceholder() {

    result.innerHTML = `

        <div class="result-placeholder">

            <div class="result-icon">
                ☎
            </div>

            <h2>
                Find your waste helpline
            </h2>

            <p>
                Select your state, city and waste type
                to see the available contact information.
            </p>

        </div>

    `;

}
